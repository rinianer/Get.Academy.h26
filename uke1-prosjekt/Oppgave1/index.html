<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsivt design i praksis</title>
    <link rel="stylesheet" href="styles.css">   
</head>

<body>
    <header>
        <div class="container">
            <h1>Responsivt design i praksis</h1>
            <p>En side som tilpasser seg til alle enheter</p>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="grid">
                <div class="card">
                    <img src="images/image1.svg" alt="Bilde 1">
                    <h2>Kort 1</h2>
                    <p>Dette innholdet tilpasser seg automatisk.</p>
                </div>
                <div class="card">
                    <img src="images/image2.svg" alt="Bilde 2">
                    <h2>Kort 2</h2>
                    <p>En kolonne på mobil, to på tablet, tre på desktop.</p>
                </div>
                <div class="card">
                    <img src="images/image3.svg" alt="Bilde 3">
                    <h2>Kort 3</h2>
                    <p>Prøv å endre bredden på nettleservinduet.</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Responsivt design eksempel</p>
        </div>
    </footer>
</body>
</html>
